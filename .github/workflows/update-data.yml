name: Update data

on:
  schedule:
    # 每周一 02:00 (UTC+8)
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch profile
        env:
          WOWS_APP_ID: ${{ secrets.WOWS_APP_ID }}
          WOWS_NICKNAME: ${{ secrets.WOWS_NICKNAME }}
          WOWS_REALM: ${{ secrets.WOWS_REALM }}
        run: |
          REALM="${WOWS_REALM:-cn}"
          if [ "$REALM" != "cn" ] && [ -z "$WOWS_APP_ID" ]; then
            echo "::notice::国际服需要 WOWS_APP_ID，未配置，跳过更新"
            exit 0
          fi
          node scripts/fetch-wows.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data

          # meta.json 里只有一个抓取时间戳，每周都会变。
          # 除了它以外没有别的内容变化时，不提交，避免一堆无意义的提交。
          CHANGED=$(git diff --staged --name-only | grep -v '^src/data/meta.json$' | wc -l | tr -d ' ')
          if [ "$CHANGED" = "0" ]; then
            echo "::notice::除时间戳外数据没有变化，跳过提交"
            exit 0
          fi

          git commit -m "chore(data): 更新战舰世界战绩数据"
          git push
